<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}} — Favemus</title>
<style>
:root{--accent:#6d6df5;--accent2:#5454e8}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#0ea5e9);padding:20px}
.card{background:#fff;border-radius:22px;padding:36px 34px;width:min(430px,94vw);box-shadow:0 24px 60px rgba(0,0,0,.28)}
.mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#a78bfa);display:grid;place-items:center;color:#fff;font-weight:800;font-size:21px;margin-bottom:16px}
h1{margin:0 0 6px;font-size:23px}.sub{color:#6b7280;font-size:14px;margin:0 0 8px}
label{display:block;margin:15px 0 6px;font-size:14px;font-weight:600}
input{width:100%;padding:12px 14px;border:1px solid #e5e7f2;border-radius:12px;font:inherit;font-size:15px}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{width:100%;margin-top:20px;padding:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:12px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#dc2626;font-size:14px;margin-top:10px;min-height:18px}
.foot{font-size:14px;color:#6b7280;margin-top:18px;text-align:center}.foot a{color:var(--accent2);text-decoration:none;font-weight:600}
</style></head><body>
<div class="card"><div class="mark">F</div><h1>{{HEADING}}</h1><p class="sub">{{SUB}}</p>
<form onsubmit="return go(event)">{{FIELDS}}<button id="btn">{{BUTTON}}</button><div class="err" id="e"></div></form>
<div class="foot">{{FOOT}}</div></div>
<script>
async function go(ev){ev.preventDefault();const b=document.getElementById('btn');b.disabled=true;b.textContent='Please wait…';const body={{BODY}};const r=await fetch('{{ENDPOINT}}',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok){document.getElementById('e').textContent=d.detail||'Failed — try again';b.disabled=false;b.textContent='{{BUTTON}}';return false}location.href='/owner';return false}
</script></body></html>
