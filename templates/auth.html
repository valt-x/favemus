<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}} — Favemus</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--accent:#6366f1;--accent2:#818cf8;--bg:#f8fafc;--panel:#ffffff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{margin:0;font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;background:var(--bg);padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:36px 34px;width:min(420px,94vw);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
.logo-text{font-weight:800;font-size:16px;letter-spacing:-.02em;color:var(--text)}
h1{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
label{display:block;margin:16px 0 6px;font-size:13px;font-weight:600;color:var(--text)}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:15px;outline:none;transition:border .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.08)}
button{width:100%;margin-top:18px;padding:13px;background:var(--accent);color:#fff;border:0;border-radius:12px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
button:hover{background:var(--accent2)}
button:disabled{opacity:.6;cursor:not-allowed}
.err{color:#dc2626;font-size:13px;margin-top:10px;min-height:18px}
.foot{font-size:14px;color:var(--muted);margin-top:18px;text-align:center}.foot a{color:var(--accent2);text-decoration:none;font-weight:600}
</style></head><body>
<div class="card">
  <div class="logo-row"><div class="logo-mark">F</div><div class="logo-text">Favemus</div></div>
  <h1>{{HEADING}}</h1><p class="sub">{{SUB}}</p>
  <form onsubmit="return go(event)">{{FIELDS}}<button id="btn">{{BUTTON}}</button><div class="err" id="e"></div></form>
  <div class="foot">{{FOOT}}</div>
</div>
<script src="/static/auth.js"></script></body></html>
