<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favemus Support Harness</title>
<style>
:root{--accent:#6d6df5;--accent2:#5454e8;--bg:#f4f5fb;--panel:#fff;--line:#e5e7f2;--text:#171923;--muted:#6b7280}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:16px}header a{color:#fff;text-decoration:none;font-size:14px;margin-left:14px;opacity:.9}header button{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);padding:7px 13px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
main{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;max-width:1080px;margin:20px auto;padding:0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(23,25,35,.06);display:flex;flex-direction:column;overflow:hidden;min-height:520px}
.card h2{margin:0;padding:16px 20px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
#log{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:11px 15px;border-radius:18px;line-height:1.45;font-size:14px;white-space:pre-wrap}
.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:6px}
.bot{align-self:flex-start;background:#eef0ff;border-bottom-left-radius:6px}
.sys{align-self:center;font-size:12px;color:var(--muted)}
form{display:flex;gap:10px;padding:13px;border-top:1px solid var(--line)}input{flex:1;padding:12px 15px;border:1px solid var(--line);border-radius:999px;font:inherit}
form button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;padding:0 22px;border-radius:999px;font:inherit;cursor:pointer}
pre{margin:0;padding:16px;overflow:auto;font-size:12px;line-height:1.55;flex:1}
.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:#eef0ff;color:var(--accent2);margin-bottom:8px}
@media(max-width:820px){main{grid-template-columns:1fr}}
</style></head><body>
<header><b>Favemus support harness</b><span><a href="/client">Client layer</a><a href="/owner">My layer (Owner)</a><button onclick="reset()">New session</button></span></header>
<main>
<section class="card"><h2>Conversation</h2><div id="log"></div>
<form onsubmit="return send(event)"><input id="msg" placeholder="Type a customer message…" autocomplete="off"><button>Send</button></form></section>
<section class="card"><h2>AI trace</h2><pre id="trace">Waiting for a message…</pre></section>
</main>
<script>
let sid=localStorage.getItem('favemus_sid');if(!sid){sid='web-'+Math.random().toString(36).slice(2,12);localStorage.setItem('favemus_sid',sid)}
const log=document.getElementById('log');const trace=document.getElementById('trace');
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
function reset(){localStorage.removeItem('favemus_sid');location.reload()}
async function send(e){e.preventDefault();const i=document.getElementById('msg');const t=i.value.trim();if(!t||i.disabled)return;i.value='';i.disabled=true;add(t,'user');add('Favemus is typing…','bot');trace.textContent='Thinking… (AI takes 2–5s)';const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),60000);try{const r=await fetch('/chat',{method:'POST',headers:{'content-type':'application/json'},signal:ctl.signal,body:JSON.stringify({message:t,session_id:sid,channel:'web'})});const d=await r.json();sid=d.session_id;localStorage.setItem('favemus_sid',sid);log.lastChild.textContent=d.reply;trace.innerHTML='';const b=document.createElement('span');b.className='badge';b.textContent='action='+d.action+' state='+d.state+' session='+d.session_id;trace.appendChild(b);trace.appendChild(document.createTextNode('\n\n'+JSON.stringify({analysis:d.analysis,tool_call:d.tool_call,routing:d.routing},null,2)))}catch(err){log.lastChild.textContent=err.name==='AbortError'?'Timed out — AI is busy. Try again.':'Error: '+err;trace.textContent=String(err)}finally{clearTimeout(to);i.disabled=false;i.focus()}}
add('Hi! Try: "Where is my order FAV-1042?" or "I want to return FAV-2231, the dress is torn."','sys');
</script></body></html>
