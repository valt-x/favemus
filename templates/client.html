<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favemus — Support</title>
<style>
:root{--accent:#6d6df5;--accent2:#5454e8;--bg:#f4f5fb;--panel:#fff;--line:#e5e7f2;--text:#171923;--muted:#6b7280}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header b{font-size:17px}header .links a{color:#fff;text-decoration:none;font-size:14px;margin-left:16px;opacity:.9}header button{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);padding:7px 13px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
main{max-width:820px;margin:22px auto;padding:0 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(23,25,35,.06);overflow:hidden;margin-bottom:20px}
.chat-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a78bfa);display:grid;place-items:center;color:#fff;font-weight:800}
.chat-head .t{font-weight:700}.chat-head .s{font-size:13px;color:var(--muted)}
#log{display:flex;flex-direction:column;gap:10px;padding:20px;min-height:260px;max-height:420px;overflow:auto}
.msg{max-width:78%;padding:11px 15px;border-radius:18px;line-height:1.45;font-size:15px;white-space:pre-wrap;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:6px}
.bot{align-self:flex-start;background:#eef0ff;color:var(--text);border-bottom-left-radius:6px}
.typing{display:inline-flex;gap:4px;padding:13px 15px}.typing i{width:7px;height:7px;border-radius:50%;background:#9aa3c7;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
form{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
input{flex:1;padding:13px 15px;border:1px solid var(--line);border-radius:999px;font:inherit;font-size:15px}
button.send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;padding:0 24px;border-radius:999px;font:inherit;cursor:pointer}
button.send:disabled{opacity:.5}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.panel h2{margin:0 0 12px;font-size:16px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
.muted{color:var(--muted);font-size:14px}
</style></head><body>
<header><b>Favemus Support</b><div class="links"><span id="who" style="font-size:13px;opacity:.85"></span><a href="/login">Login</a><a href="/owner">Owner</a><button onclick="logout()">Logout</button></div></header>
<main>
<div class="card">
<div class="chat-head"><div class="avatar">F</div><div><div class="t">Favemus AI Support</div><div class="s">Online · replies instantly · same AI on WhatsApp</div></div></div>
<div id="log"></div>
<div class="chips"><button class="chip" onclick="quick('Where is my order FAV-1042?')">📦 Order status</button><button class="chip" onclick="quick('I want to return FAV-2231, the dress is torn.')">↩️ Return</button><button class="chip" onclick="quick('Show green wrap dresses')">👗 Products</button><button class="chip" onclick="quick('human')">🧑 Human agent</button></div>
<form onsubmit="return send(event)"><input id="msg" placeholder="Type your message…" autocomplete="off"><button class="send" id="sendBtn">Send</button></form>
</div>
<div class="panel"><h2>My conversations &amp; tickets</h2><div id="mine" class="muted">Login to see your own conversations and tickets here.</div><table id="sessions"></table><table id="tickets"></table></div>
</main>
<script>
let sid=localStorage.getItem('favemus_sid');if(!sid){sid='web-'+Math.random().toString(36).slice(2,12);localStorage.setItem('favemus_sid',sid)}
const log=document.getElementById('log');
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
function typing(on){const old=document.querySelector('.typing');if(on&&!old){const d=document.createElement('div');d.className='msg bot typing';d.innerHTML='<i></i><i></i><i></i>';log.appendChild(d);log.scrollTop=log.scrollHeight}if(!on&&old)old.remove()}
function quick(t){document.getElementById('msg').value=t;document.getElementById('msg').dispatchEvent(new Event('submit',{cancelable:true}));send(new Event('submit',{cancelable:true}))}
let sending=false;
async function send(e){e.preventDefault();const i=document.getElementById('msg');const t=i.value.trim();if(!t||sending)return;sending=true;i.disabled=true;document.getElementById('sendBtn').disabled=true;i.value='';add(t,'user');typing(true);const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),60000);try{const r=await fetch('/chat',{method:'POST',headers:{'content-type':'application/json'},signal:ctl.signal,body:JSON.stringify({message:t,session_id:sid,channel:'web'})});const d=await r.json();sid=d.session_id;localStorage.setItem('favemus_sid',sid);typing(false);add(d.reply||'Sorry, I could not answer.','bot')}catch(err){typing(false);add(err.name==='AbortError'?'Timed out — the AI is busy. Please try again.':'Network error. Please try again.','bot')}finally{clearTimeout(to);sending=false;i.disabled=false;document.getElementById('sendBtn').disabled=false;i.focus()}loadMine()}
async function logout(){await fetch('/auth/logout',{method:'POST'});location.reload()}
async function loadMine(){const m=await fetch('/auth/me');if(!m.ok)return;const me=(await m.json()).user;document.getElementById('who').textContent=me.email;document.getElementById('mine').textContent='';const s=await(await fetch('/harness/my/sessions')).json();document.getElementById('sessions').innerHTML='<tr><th>Session</th><th>State</th></tr>'+(s.sessions||[]).map(x=>'<tr><td>'+x.id+'</td><td>'+(x.state||'')+'</td></tr>').join('');const t=await(await fetch('/harness/my/tickets')).json();document.getElementById('tickets').innerHTML='<tr><th>Ticket</th><th>Kind</th><th>Status</th></tr>'+(t.tickets||[]).map(x=>'<tr><td>#'+x.id+'</td><td>'+(x.kind||'')+'</td><td>'+(x.status||'')+'</td></tr>').join('')}
add('Hi! I can help with order status, returns, exchanges, refunds, and product questions.','bot');loadMine();
</script></body></html>
